name: Process LinkedIn Post Queue

on:
  push:
    branches: [master]
    paths:
      - "_data/linkedin_posts_queue.txt"
  workflow_dispatch:

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Process queued LinkedIn post URLs
        run: python scritps/process_linkedin_queue.py

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add _data/linkedin_posts.yml _data/linkedin_posts_queue.txt
          if git diff --cached --quiet; then
            echo "No new posts to add, nothing to commit."
          else
            git commit -m "Add new LinkedIn post(s) to News page"
            git push
          fi
