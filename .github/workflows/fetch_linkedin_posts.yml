name: Fetch LinkedIn Posts

# Uses an unofficial, reverse-engineered LinkedIn API (see
# scritps/fetch_linkedin_posts.py) authenticated with a copied session
# cookie stored in LINKEDIN_LI_AT / LINKEDIN_JSESSIONID repo secrets.
# This is against LinkedIn's Terms of Service for automated access and
# can get the account flagged or restricted -- see the setup notes at
# the top of that script before relying on this.

on:
  schedule:
    - cron: "0 6 * * *" # once a day
  workflow_dispatch:

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies for lxml
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install linkedin-api pyyaml

      - name: Fetch recent LinkedIn posts
        env:
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_JSESSIONID: ${{ secrets.LINKEDIN_JSESSIONID }}
        run: python scritps/fetch_linkedin_posts.py

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add _data/linkedin_posts.yml
          if git diff --cached --quiet; then
            echo "No new posts to add, nothing to commit."
          else
            git commit -m "Add new LinkedIn post(s) to News page"
            git push
          fi
